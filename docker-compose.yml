services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: travel-booking-backend:latest
    container_name: travel-booking-backend
    env_file:
      - .env
    environment:
      # Inside the compose network the database host is always `db`.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    # Hardening: no extra privileges, no Linux capabilities, read-only filesystem.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: travel-booking-frontend:latest
    container_name: travel-booking-frontend
    depends_on:
      - backend
    # Bound to localhost only; on the Hostinger VPS, Traefik (a separate running
    # container) routes the public domain to this port via the labels below.
    # nginx in this container proxies /api/* to the backend, so one router
    # covers the whole app and the backend needs no published port.
    # Change FRONTEND_PORT if 8083 is already taken by another app on the VPS.
    # The container itself listens on the unprivileged port 8080 (runs as non-root).
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8083}:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.travelbooking.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.travelbooking.entrypoints=websecure"
      - "traefik.http.routers.travelbooking.tls=true"
      - "traefik.http.routers.travelbooking.tls.certresolver=letsencrypt"
      - "traefik.http.services.travelbooking.loadbalancer.server.url=http://127.0.0.1:${FRONTEND_PORT:-8083}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  postgres_data:
